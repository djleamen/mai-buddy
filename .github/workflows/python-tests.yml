name: Python tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The tool guards under test are pure Python; pywebview/pystray/pynput
      # need a display and are exercised by running the app.
      - run: pip install pytest
      - run: pytest python/tests -q
